name: jp_typewriter
description: A cross-platform Jianpu notation editor prototype.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  cupertino_ui: ^1.1.7
  drift: ^2.28.1
  flutter:
    sdk: flutter
  google_fonts: ^9.0.0
  material_ui: ^1.11.1
  path: ^1.9.1
  sqflite: ^2.4.2
  super_clipboard: ^0.9.1
  super_editor: 0.3.0-dev.52

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.28.1

flutter:
  uses-material-design: true
